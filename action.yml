name: 'Upload to WebDAV'
description: 'Upload files to a WebDAV server with automatic version management and cleanup'
author: 'weijia'

inputs:
  webdav-url:
    description: 'WebDAV server URL (e.g. https://dav.example.com)'
    required: true
  webdav-username:
    description: 'WebDAV username'
    required: true
  webdav-password:
    description: 'WebDAV password'
    required: true
  webdav-root:
    description: 'Root directory prefix on the WebDAV server (e.g. "online/my-app")'
    required: false
    default: ''
  source-directory:
    description: 'Local directory to upload'
    required: true
  upload-directory:
    description: 'Remote subdirectory name. Overrides automatic behavior. Defaults to timestamp for untagged commits, "release" for tagged commits.'
    required: false
    default: ''
  copy-to-latest:
    description: 'Copy uploaded files to a "latest" directory under webdav-root (clears existing latest directory first)'
    required: false
    default: 'true'
  keep-versions:
    description: 'Number of old version directories to keep before cleanup. Set to 0 to disable cleanup.'
    required: false
    default: '5'
  debug:
    description: 'Enable debug mode for detailed logging'
    required: false
    default: 'false'

outputs:
  upload-url:
    description: 'The URL where files were uploaded'
  latest-url:
    description: 'The URL of the latest directory (if copy-to-latest is enabled)'

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'upload-cloud'
  color: 'blue'
